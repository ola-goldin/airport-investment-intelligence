# Airport Investment Intelligence Agent — one command demo.
#
#   docker compose up   # backend + frontend + Dify tool tunnel + local Whisper STT
#
# All services are optional except `backend`; the chat works without the UI
# (POST /api/chat) and without voice (text input only). The `tunnel` service
# is required for Dify Cloud tool calls (cloud servers cannot reach localhost).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Set to 1 to attempt authoritative BTS/OurAirports/FAA downloads;
      # 0 keeps the fully offline, reproducible seed dataset.
      AIRPORT_AGENT_BTS_DOWNLOAD: "${AIRPORT_AGENT_BTS_DOWNLOAD:-0}"
      # Source endpoints (see backend/app/data/endpoints.py + .env.example).
      # Defaults below match the in-code defaults, so the service behaves the
      # same with or without a local .env file.
      BTS_BASE_URL: "${BTS_BASE_URL:-https://www.transtats.bts.gov/DownLoad_Table.asp}"
      BTS_T100_QUERY: "${BTS_T100_QUERY:-?Table_ID=311&Year={year}&AllVars=1&Zype=csv}"
      FAA_ENPLANEMENTS_URL: "${FAA_ENPLANEMENTS_URL:-https://www.faa.gov/airports/planning_capacity/passenger_allcargo_stats/passenger/media/cy23-all-enplanements.xlsx}"
      OURAIRPORTS_URL: "${OURAIRPORTS_URL:-https://davidmegginson.github.io/ourairports-data/airports.csv}"
    volumes:
      # Persist the Parquet cache + any downloaded raw data.
      - ./data:/srv/data

  frontend:
    image: node:20-alpine
    working_dir: /ui
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Dify iframe URL. Defaults to the shared Dify Cloud chatbot so the
      # embedded chat works out of the box; override via a root .env or
      # frontend/.env. Empty -> frontend falls back to the deterministic chat.
      VITE_DIFY_CHATBOT_URL: "${VITE_DIFY_CHATBOT_URL:-https://udify.app/chatbot/UfdIIKocvyo9IdrW}"
      # Local voice service for the fallback chat's mic button (browser calls
      # :8100 directly; same-host default works via the published port).
      VITE_STT_URL: "${VITE_STT_URL:-http://localhost:8100}"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/ui
      - /ui/node_modules

  # Public quick tunnel to the backend — required for Dify Cloud tool calls.
  # The ephemeral https://....trycloudflare.com URL is printed in the logs:
  #   docker compose logs tunnel
  # scripts/setup_infra.ps1 syncs it into dify/openapi.yaml automatically;
  # when it changes you must re-sync the tool in Dify (Integrations -> Tools)
  # and republish the app. Verify with: python scripts/check_tunnel.py
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8000
    depends_on:
      - backend

  # Local Whisper STT for the fallback chat's mic button (default-on).
  # Starts with the stack; no secrets, no cloud. If the model can't load
  # (hardware limits), the service stays up and POST /transcribe returns
  # 503 — the mic button explains it and typed chat keeps working.
  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      STT_MODEL_SIZE: "${STT_MODEL_SIZE:-base}"
      STT_DEVICE: "${STT_DEVICE:-cpu}"
    volumes:
      - stt_models:/root/.cache/huggingface

volumes:
  stt_models:
